<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문장 서랍</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F6659">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380..600&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style id="app-style">
  :root{
    --bg:#EFEBDD;
    --surface:#FBF9F1;
    --surface-alt:#E4DFCD;
    --ink:#23281F;
    --ink-soft:#5B5F4E;
    --accent:#2F6659;
    --accent-ink:#F2F7F4;
    --accent-soft:#DCE8D9;
    --gold:#B9852F;
    --gold-soft:#F1E4C7;
    --danger:#A6432E;
    --danger-soft:#F3E1DB;
    --border:#D8D2BC;
    --shadow:0 1px 2px rgba(35,40,31,.08), 0 6px 18px rgba(35,40,31,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160F;
      --surface:#1B211A;
      --surface-alt:#232B20;
      --ink:#ECE7D8;
      --ink-soft:#A9AC98;
      --accent:#6FAE97;
      --accent-ink:#0E1B16;
      --accent-soft:#22332C;
      --gold:#D9A64E;
      --gold-soft:#3A2E18;
      --danger:#D97A62;
      --danger-soft:#34211C;
      --border:#313829;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160F;
    --surface:#1B211A;
    --surface-alt:#232B20;
    --ink:#ECE7D8;
    --ink-soft:#A9AC98;
    --accent:#6FAE97;
    --accent-ink:#0E1B16;
    --accent-soft:#22332C;
    --gold:#D9A64E;
    --gold-soft:#3A2E18;
    --danger:#D97A62;
    --danger-soft:#34211C;
    --border:#313829;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .page{max-width:640px;margin:0 auto;padding:28px 20px 80px;}

  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .brand{display:flex;align-items:flex-start;gap:12px;}
  .brand-mark{
    font-family:'Fraunces',serif;font-size:1.6rem;color:var(--accent);
    background:var(--accent-soft);width:44px;height:44px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-text h1{
    font-family:'Fraunces',serif;font-weight:560;font-size:1.5rem;margin:0 0 2px;
    text-wrap:balance; color:var(--ink);
  }
  .brand-text .tagline{margin:0;font-size:.86rem;color:var(--ink-soft);}
  .stats{display:flex;gap:14px;flex-shrink:0;padding-top:2px;}
  .stat{text-align:right;}
  .stat-num{
    display:block;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;
    font-size:1.15rem;font-weight:500;color:var(--ink);line-height:1.1;
  }
  .stat-label{font-size:.72rem;color:var(--ink-soft);}

  .sync-note{
    display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--ink-soft);
    background:var(--surface-alt);border-radius:10px;padding:8px 12px;margin-bottom:16px;
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .sync-dot.offline{background:var(--danger);}

  .seed-banner{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--ink);
    background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;
    padding:10px 12px;margin-bottom:16px;
  }
  .seed-banner span{flex:1;min-width:160px;}

  .tabs{display:flex;gap:4px;background:var(--surface-alt);padding:4px;border-radius:12px;margin-bottom:20px;}
  .tab{
    flex:1;border:none;background:transparent;color:var(--ink-soft);font-family:inherit;
    font-size:.92rem;font-weight:500;padding:9px 10px;border-radius:9px;cursor:pointer;
  }
  .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .view{display:none;}
  .view[data-active="true"]{display:block;}

  .segmented{display:flex;gap:8px;margin-bottom:14px;}
  .seg-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    font-family:inherit;font-size:.82rem;font-weight:500;padding:7px 13px;border-radius:999px;cursor:pointer;
  }
  .seg-btn[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .seg-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .review-progress{
    font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;
    font-size:.78rem;color:var(--ink-soft);margin-bottom:10px;letter-spacing:.02em;
  }

  .card-slot{margin-bottom:16px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:26px 22px 18px;box-shadow:var(--shadow);
  }
  .card-eyebrow{margin:0 0 8px;font-size:.74rem;color:var(--ink-soft);letter-spacing:.02em;}
  .card-face{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .card-phrase{
    font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.35rem,4.6vw,1.85rem);
    line-height:1.35;margin:0;text-wrap:balance;color:var(--ink);flex:1;
  }
  .icon-btn{
    border:1px solid var(--border);background:var(--surface-alt);border-radius:9px;
    width:38px;height:38px;flex-shrink:0;cursor:pointer;font-size:1rem;
    display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .icon-btn:hover{background:var(--accent-soft);}
  .icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed;}

  .reveal-btn{
    margin-top:16px;border:none;background:none;color:var(--accent);font-family:inherit;
    font-size:.85rem;font-weight:600;cursor:pointer;padding:6px 0;
  }
  .reveal-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .card-back{margin-top:6px;padding-top:14px;border-top:1px solid var(--border);}
  .card-meaning{margin:0 0 12px;font-size:.95rem;color:var(--ink);line-height:1.5;}
  .card-examples{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .card-examples li{
    font-size:.88rem;color:var(--ink-soft);line-height:1.5;background:var(--surface-alt);
    border-radius:10px;padding:9px 10px 9px 12px;
  }
  .ex-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .ex-translation{
    margin:6px 0 0;padding-top:6px;border-top:1px dashed var(--border);
    font-size:.85rem;color:var(--ink);
  }
  .ex-tag{
    font-size:.68rem;font-weight:600;color:var(--accent);background:var(--accent-soft);
    border-radius:6px;padding:1px 6px;margin-right:7px;flex-shrink:0;vertical-align:2px;
  }
  .translate-toggle-btn{
    display:block;margin:0 0 10px;border:1px solid var(--border);background:var(--surface);
    color:var(--ink-soft);font-family:inherit;font-size:.78rem;font-weight:600;
    padding:6px 12px;border-radius:999px;cursor:pointer;
  }
  .translate-toggle-btn:hover{border-color:var(--accent);color:var(--accent);}
  .card-empty-ex{margin:0;font-size:.85rem;color:var(--ink-soft);}
  .icon-btn-sm{
    border:none;background:transparent;cursor:pointer;font-size:.9rem;flex-shrink:0;
    width:28px;height:28px;color:var(--accent);
  }

  .card-footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}
  .star-toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft);cursor:pointer;width:fit-content;}
  .star-toggle input{width:16px;height:16px;accent-color:var(--gold);}

  .autoplay-start-btn{
    display:block;width:100%;margin-top:12px;border:1px dashed var(--border);background:transparent;
    color:var(--ink-soft);font-family:inherit;font-size:.85rem;font-weight:600;
    padding:10px;border-radius:10px;cursor:pointer;
  }
  .autoplay-start-btn:hover{border-color:var(--accent);color:var(--accent);}

  .autoplay-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow);
    padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }
  .autoplay-info{flex:1;min-width:180px;}
  .autoplay-phrase{margin:0;font-family:'Fraunces',serif;font-size:.9rem;color:var(--ink-soft);}
  .autoplay-example{margin:2px 0 0;font-size:.98rem;color:var(--ink);line-height:1.4;}
  .autoplay-translation{margin:4px 0 0;font-size:.85rem;color:var(--ink-soft);}
  .autoplay-controls{display:flex;gap:6px;flex-shrink:0;}
  .autoplay-controls .icon-btn{width:34px;height:34px;font-size:.9rem;}
  body.autoplay-open .page{padding-bottom:120px;}

  .review-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .mastered-filter{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--ink-soft);cursor:pointer;}
  .mastered-filter input{width:15px;height:15px;accent-color:var(--accent);}

  .btn{
    font-family:inherit;font-size:.88rem;font-weight:600;border-radius:10px;
    padding:10px 18px;border:1px solid transparent;cursor:pointer;
  }
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--border);}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-sm{padding:7px 12px;font-size:.8rem;}

  .list-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  #search-input{
    flex:1;min-width:160px;font-family:inherit;font-size:.9rem;padding:9px 12px;
    border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);
  }
  #search-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .phrase-list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .phrase-row{
    display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:12px 12px;cursor:pointer;
  }
  .phrase-row:hover{border-color:var(--accent);}
  .phrase-row-main{flex:1;min-width:0;}
  .phrase-row-text{
    margin:0;font-family:'Fraunces',serif;font-size:1rem;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .phrase-row-meaning{margin:2px 0 0;font-size:.8rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .star-badge{color:var(--gold);font-size:.95rem;flex-shrink:0;}
  .row-mastered-toggle{width:16px;height:16px;accent-color:var(--gold);flex-shrink:0;}

  .empty-note{font-size:.88rem;color:var(--ink-soft);text-align:center;padding:30px 10px;}

  .list-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}

  .phrase-form{display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--ink-soft);}
  .field span{font-weight:600;color:var(--ink);}
  .field textarea,.field input[type="text"]{
    font-family:inherit;font-size:.94rem;color:var(--ink);background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:10px 12px;resize:vertical;
  }
  .field textarea:focus-visible,.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .form-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .form-actions-right{display:flex;gap:8px;}

  .delete-confirm{
    background:var(--danger-soft);border-radius:10px;padding:12px 14px;font-size:.85rem;
    color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  }

  .foot-note{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);}
  .foot-note p{margin:0;font-size:.78rem;color:var(--ink-soft);line-height:1.6;}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);font-size:.85rem;padding:10px 18px;
    border-radius:999px;box-shadow:var(--shadow);z-index:20;max-width:90vw;text-align:center;
  }

  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="page" id="app"></div>

<template id="app-shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✎</span>
      <div class="brand-text">
        <h1>문장 서랍</h1>
        <p class="tagline">기억하고 싶은 표현을 넣어두고, 다시 꺼내 보세요</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">표현</span></div>
      <div class="stat"><span class="stat-num" id="stat-mastered">0</span><span class="stat-label">외움</span></div>
    </div>
  </header>

  <div class="sync-note" id="sync-note"></div>
  <div class="seed-banner" id="seed-banner" hidden>
    <span id="seed-banner-text"></span>
    <button type="button" id="seed-banner-btn" class="btn btn-primary btn-sm">추가하기</button>
    <button type="button" id="seed-banner-dismiss" class="btn btn-ghost btn-sm">나중에</button>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab" data-view="review" role="tab" aria-selected="true">복습</button>
    <button class="tab" data-view="list" role="tab" aria-selected="false">목록</button>
    <button class="tab" data-view="add" role="tab" aria-selected="false">추가</button>
  </nav>

  <main>
    <section id="view-review" class="view" data-active="true">
      <div class="segmented" role="tablist">
        <button class="seg-btn" data-mode="daily" aria-selected="true">오늘의 카드</button>
        <button class="seg-btn" data-mode="random" aria-selected="false">전체 랜덤</button>
      </div>
      <div id="review-progress" class="review-progress"></div>
      <div id="review-card-slot" class="card-slot"></div>
      <div class="review-controls">
        <label class="mastered-filter">
          <input type="checkbox" id="include-mastered-review">
          <span>외운 표현도 포함</span>
        </label>
        <button id="next-card-btn" class="btn btn-primary" type="button">다음 카드</button>
      </div>
      <button id="autoplay-start-btn" class="autoplay-start-btn" type="button">🔀 예문 전체 랜덤 재생</button>
    </section>

    <section id="view-list" class="view" data-active="false">
      <div class="list-toolbar">
        <input type="search" id="search-input" placeholder="표현 검색">
        <label class="mastered-filter">
          <input type="checkbox" id="include-mastered-list" checked>
          <span>외운 표현 포함</span>
        </label>
      </div>
      <ul id="phrase-list" class="phrase-list"></ul>
      <p id="list-empty" class="empty-note" hidden></p>
      <div class="list-actions">
        <button id="export-btn" class="btn btn-ghost btn-sm" type="button">내보내기 (백업)</button>
        <button id="import-btn" class="btn btn-ghost btn-sm" type="button">가져오기</button>
        <input type="file" id="import-file" accept="application/json" hidden>
      </div>
    </section>

    <section id="view-add" class="view" data-active="false">
      <form id="phrase-form" class="phrase-form">
        <input type="hidden" id="edit-id" value="">
        <label class="field">
          <span>표현 / 문장 *</span>
          <textarea id="field-text" rows="2" required placeholder="예: I have no idea how she solved that problem."></textarea>
        </label>
        <label class="field">
          <span>뜻 / 설명</span>
          <input type="text" id="field-meaning" placeholder="예: 그녀가 어떻게 풀었는지 전혀 모르겠다">
        </label>
        <label class="field">
          <span>예문 1</span>
          <input type="text" id="field-ex1" placeholder="이 표현을 사용한 문장">
        </label>
        <label class="field">
          <span>예문 2</span>
          <input type="text" id="field-ex2" placeholder="이 표현을 사용한 다른 문장">
        </label>
        <label class="field">
          <span>예문 3 (업무 상황)</span>
          <input type="text" id="field-ex3" placeholder="예: PCIe/USB 검증 업무에서 쓰는 문장">
        </label>
        <div class="form-actions">
          <button type="button" id="delete-btn" class="btn btn-danger" hidden>삭제</button>
          <div class="form-actions-right">
            <button type="button" id="cancel-edit-btn" class="btn btn-ghost" hidden>취소</button>
            <button type="submit" class="btn btn-primary" id="submit-btn">저장</button>
          </div>
        </div>
        <p id="delete-confirm" class="delete-confirm" hidden>
          <span>정말 삭제할까요? 되돌릴 수 없어요.</span>
          <button type="button" id="confirm-delete-btn" class="btn btn-danger btn-sm">삭제 확인</button>
          <button type="button" id="cancel-delete-btn" class="btn btn-ghost btn-sm">취소</button>
        </p>
      </form>
    </section>
  </main>

  <footer class="foot-note">
    <p>이 서랍은 열 때마다 저장된 표현 중 일부를 자동으로 골라 보여줘요. 알림을 따로 보내진 않으니, 생각날 때 직접 열어 확인해보세요. 발음은 이 기기의 음성 합성 기능을 사용해요. 화면이 꺼지거나 다른 앱으로 전환하면 기기에 따라 재생이 멈출 수 있어요.</p>
  </footer>

  <div class="autoplay-bar" id="autoplay-bar" hidden>
    <div class="autoplay-info">
      <p class="autoplay-phrase" id="autoplay-phrase-text"></p>
      <p class="autoplay-example" id="autoplay-example-text"></p>
      <p class="autoplay-translation" id="autoplay-translation-text" hidden></p>
    </div>
    <div class="autoplay-controls">
      <button id="autoplay-translate-btn" class="icon-btn" type="button" aria-label="번역 보기">가</button>
      <button id="autoplay-pause-btn" class="icon-btn" type="button" aria-label="일시정지">⏸</button>
      <button id="autoplay-next-btn" class="icon-btn" type="button" aria-label="다음 예문">⏭</button>
      <button id="autoplay-stop-btn" class="icon-btn" type="button" aria-label="정지">⏹</button>
    </div>
  </div>
</template>

<script type="application/json" id="phrase-data">[
  {
    "id": "p1",
    "text": "I've ever had",
    "meaning": "지금까지 겪어본 것 중에서 (최고/최악)라는 뜻으로, 최상급 뒤에 붙여 써요.",
    "examples": [
      {
        "text": "This is the best coffee I've ever had.",
        "tag": "일상",
        "ko": "이건 내가 지금까지 마셔본 커피 중에 최고야."
      },
      {
        "text": "That was the worst flight I've ever had.",
        "tag": "일상",
        "ko": "그건 내가 지금까지 겪어본 것 중 최악의 비행이었어."
      },
      {

<script id="app-script">
(function(){
  "use strict";

  var LOCAL_STORAGE_KEY = "sentenceDrawer.v1.phrases";
  var PREF_REVIEW_MASTERED_KEY = "sentenceDrawer.v1.pref.reviewIncludeMastered";
  var DAILY_SET_SIZE = 4;
  var HEAD_STATIC = '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>문장 서랍</title>\n<link rel="manifest" href="manifest.json">\n<meta name="theme-color" content="#2F6659">\n<link rel="icon" href="icon-192.png">\n<link rel="apple-touch-icon" href="icon-192.png">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380..600&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">';

  var artifactAPI = null;
  var storageMode = "local"; // "artifact" | "local"
  var writable = true;

  var state = {
    phrases: [],
    reviewMode: "daily",
    reviewPool: [],
    reviewIdx: 0,
    reviewIncludeMastered: getPref(PREF_REVIEW_MASTERED_KEY, false),
    listIncludeMastered: true,
    searchQuery: "",
    lastRandomId: null
  };

  function readSeedData(){
    try{
      return JSON.parse(document.getElementById("phrase-data").textContent);
    }catch(e){ return []; }
  }

  function loadLocalPhrases(){
    var seed = readSeedData();
    try{
      var raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if(raw === null){
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(seed));
        return seed;
      }
      var parsed = JSON.parse(raw);
      if(!Array.isArray(parsed)) throw new Error("bad shape");
      return parsed;
    }catch(e){
      return seed;
    }
  }

  function getPref(key, fallback){
    try{
      var v = localStorage.getItem(key);
      if(v === null) return fallback;
      return v === "1";
    }catch(e){ return fallback; }
  }
  function setPref(key, val){
    try{ localStorage.setItem(key, val ? "1" : "0"); }catch(e){}
  }

  // ---------- mount shell ----------
  var appRoot = document.getElementById("app");
  appRoot.innerHTML = document.getElementById("app-shell").innerHTML;

  // ---------- helpers ----------
  function esc(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function uid(){
    return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById("toast");
    if(!el) return;
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.hidden = true; }, 3400);
  }
  // Picking a real voice matters: without one, some browsers fall back to a
  // low-quality/robotic engine voice instead of the natural on-device one.
  // Voices load asynchronously, so this may need a second pass via 'voiceschanged'.
  var preferredVoice = null;
  function pickPreferredVoice(){
    if(!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    if(!voices.length) return null;
    var enVoices = voices.filter(function(v){ return /^en(-|_|$)/i.test(v.lang); });
    if(!enVoices.length) return null;
    var usVoices = enVoices.filter(function(v){ return /en-US/i.test(v.lang); });
    var pool = usVoices.length ? usVoices : enVoices;
    var natural = pool.filter(function(v){ return /google|natural|online|enhanced|neural/i.test(v.name); });
    return (natural[0] || pool[0]);
  }
  function initVoices(){
    if(!("speechSynthesis" in window)) return;
    preferredVoice = pickPreferredVoice();
    window.speechSynthesis.addEventListener("voiceschanged", function(){
      preferredVoice = pickPreferredVoice();
    });
  }
  initVoices();

  function makeUtterance(text){
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.95;
    if(preferredVoice) u.voice = preferredVoice;
    return u;
  }

  function speak(text){
    if(!("speechSynthesis" in window)) { showToast("이 브라우저는 음성 재생을 지원하지 않아요."); return; }
    try{
      // Only cancel when something is actually in flight — calling cancel()
      // before every single speak() (even when idle) is what made playback
      // sound clipped/robotic, especially back-to-back during autoplay.
      if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
        window.speechSynthesis.cancel();
      }
      window.speechSynthesis.speak(makeUtterance(text));
    }catch(e){ /* ignore */ }
  }
  var speechSupported = ("speechSynthesis" in window);

  function activePhrases(includeMastered){
    return state.phrases.filter(function(p){ return includeMastered || !p.mastered; });
  }

  function renderSyncNote(){
    var el = document.getElementById("sync-note");
    if(!el) return;
    if(storageMode === "artifact" && writable){
      el.innerHTML = '<span class="sync-dot"></span><span>이 링크로 열면 폰/PC 어디서나 같은 내용이 저장돼요.</span>';
    }else if(storageMode === "artifact" && !writable){
      el.innerHTML = '<span class="sync-dot offline"></span><span>지금은 읽기 전용으로 열려 있어요. 저장하려면 소유자 계정으로 열어주세요.</span>';
    }else{
      el.innerHTML = '<span class="sync-dot offline"></span><span>이 브라우저에만 저장돼요. 다른 기기로 옮기려면 목록 탭의 "내보내기"를 쓰세요.</span>';
    }
  }

  // ---------- tabs ----------
  var tabs = appRoot.querySelectorAll(".tab");
  tabs.forEach(function(btn){
    btn.addEventListener("click", function(){ switchView(btn.dataset.view); });
  });
  function activateView(view){
    tabs.forEach(function(btn){
      btn.setAttribute("aria-selected", btn.dataset.view === view ? "true" : "false");
    });
    appRoot.querySelectorAll(".view").forEach(function(sec){
      sec.dataset.active = (sec.id === "view-" + view) ? "true" : "false";
    });
  }
  function switchView(view){
    activateView(view);
    if(view === "review") renderReviewCard(true);
    if(view === "list") renderList();
  }

  // ---------- review ----------
  var segBtns = appRoot.querySelectorAll(".seg-btn");
  segBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      state.reviewMode = btn.dataset.mode;
      segBtns.forEach(function(b){ b.setAttribute("aria-selected", b === btn ? "true" : "false"); });
      state.reviewIdx = 0;
      renderReviewCard(true);
    });
  });

  document.getElementById("include-mastered-review").checked = state.reviewIncludeMastered;
  document.getElementById("include-mastered-review").addEventListener("change", function(e){
    state.reviewIncludeMastered = e.target.checked;
    setPref(PREF_REVIEW_MASTERED_KEY, state.reviewIncludeMastered);
    state.reviewIdx = 0;
    renderReviewCard(true);
  });

  document.getElementById("next-card-btn").addEventListener("click", function(){ advanceReview(); });

  // ---------- autoplay: continuous random playback of every example sentence ----------
  var autoplay = { active: false, paused: false, queue: [], index: -1, translationsOn: false, gen: 0 };

  function buildAutoplayQueue(){
    var pool = activePhrases(state.reviewIncludeMastered);
    var items = [];
    pool.forEach(function(p){
      (p.examples || []).forEach(function(ex){
        if(ex && ex.text) items.push({ phraseText: p.text, ex: ex });
      });
    });
    for(var i = items.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = items[i]; items[i] = items[j]; items[j] = tmp;
    }
    return items;
  }

  function autoplayRenderCurrent(){
    var item = autoplay.queue[autoplay.index];
    if(!item) return;
    document.getElementById("autoplay-phrase-text").textContent = item.phraseText;
    document.getElementById("autoplay-example-text").textContent = item.ex.text;
    var trEl = document.getElementById("autoplay-translation-text");
    if(item.ex.ko){
      trEl.textContent = item.ex.ko;
      trEl.hidden = !autoplay.translationsOn;
    }else{
      trEl.textContent = "";
      trEl.hidden = true;
    }
  }

  // Small gap between utterances — calling speak() again the instant the
  // previous one ends is what made autoplay sound clipped/robotic on some
  // engines. A brief pause lets the TTS engine fully release before the next.
  var AUTOPLAY_GAP_MS = 350;

  function autoplaySpeakCurrent(){
    var item = autoplay.queue[autoplay.index];
    if(!item){ autoplayStop(); return; }
    if(!speechSupported){ autoplayAdvance(); return; }
    autoplay.gen++;
    var myGen = autoplay.gen;
    try{
      // Only cancel if something is actually still in flight (e.g. the user
      // hit "다음" mid-sentence) — cancelling on every normal advance is
      // what caused the choppy/robotic sound during continuous playback.
      if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
        window.speechSynthesis.cancel();
      }
      var u = makeUtterance(item.ex.text);
      u.onend = function(){
        if(autoplay.active && !autoplay.paused && autoplay.gen === myGen){
          setTimeout(function(){
            if(autoplay.active && !autoplay.paused && autoplay.gen === myGen) autoplayAdvance();
          }, AUTOPLAY_GAP_MS);
        }
      };
      u.onerror = function(){
        if(autoplay.active && !autoplay.paused && autoplay.gen === myGen) autoplayAdvance();
      };
      window.speechSynthesis.speak(u);
    }catch(e){
      autoplayAdvance();
    }
  }

  function autoplayAdvance(){
    if(!autoplay.active) return;
    autoplay.index++;
    if(autoplay.index >= autoplay.queue.length){
      autoplay.queue = buildAutoplayQueue();
      autoplay.index = 0;
      if(autoplay.queue.length === 0){ autoplayStop(); return; }
    }
    autoplayRenderCurrent();
    autoplaySpeakCurrent();
  }

  function autoplayStart(){
    var queue = buildAutoplayQueue();
    if(queue.length === 0){
      showToast("재생할 예문이 없어요.");
      return;
    }
    autoplay.active = true;
    autoplay.paused = false;
    autoplay.queue = queue;
    autoplay.index = -1;
    document.getElementById("autoplay-bar").hidden = false;
    document.body.classList.add("autoplay-open");
    var pauseBtn = document.getElementById("autoplay-pause-btn");
    pauseBtn.textContent = "⏸";
    pauseBtn.setAttribute("aria-label", "일시정지");
    autoplayAdvance();
  }

  function autoplayStop(){
    autoplay.active = false;
    autoplay.paused = false;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    document.getElementById("autoplay-bar").hidden = true;
    document.body.classList.remove("autoplay-open");
  }

  function autoplayTogglePause(){
    if(!autoplay.active) return;
    var btn = document.getElementById("autoplay-pause-btn");
    if(!autoplay.paused){
      autoplay.paused = true;
      try{ window.speechSynthesis.pause(); }catch(e){}
      btn.textContent = "▶";
      btn.setAttribute("aria-label", "재생");
    }else{
      autoplay.paused = false;
      try{ window.speechSynthesis.resume(); }catch(e){}
      btn.textContent = "⏸";
      btn.setAttribute("aria-label", "일시정지");
    }
  }

  document.getElementById("autoplay-start-btn").addEventListener("click", autoplayStart);
  document.getElementById("autoplay-stop-btn").addEventListener("click", autoplayStop);
  document.getElementById("autoplay-pause-btn").addEventListener("click", autoplayTogglePause);
  document.getElementById("autoplay-next-btn").addEventListener("click", function(){
    if(autoplay.paused){
      autoplay.paused = false;
      var pauseBtn = document.getElementById("autoplay-pause-btn");
      pauseBtn.textContent = "⏸";
      pauseBtn.setAttribute("aria-label", "일시정지");
    }
    autoplayAdvance();
  });
  document.getElementById("autoplay-translate-btn").addEventListener("click", function(){
    autoplay.translationsOn = !autoplay.translationsOn;
    var trEl = document.getElementById("autoplay-translation-text");
    var item = autoplay.queue[autoplay.index];
    if(item && item.ex.ko) trEl.hidden = !autoplay.translationsOn;
  });

  function getDailyPool(pool){
    if(pool.length === 0) return [];
    var dayIndex = Math.floor(Date.now() / 86400000);
    var n = pool.length;
    var size = Math.min(DAILY_SET_SIZE, n);
    var start = (dayIndex * size) % n;
    var out = [];
    for(var i=0;i<size;i++){ out.push(pool[(start+i) % n]); }
    return out;
  }

  function computeReviewPool(){
    var pool = activePhrases(state.reviewIncludeMastered);
    if(state.reviewMode === "daily"){
      return getDailyPool(pool);
    }
    return pool;
  }

  function advanceReview(){
    var pool = computeReviewPool();
    if(pool.length === 0){ renderReviewCard(true); return; }
    if(state.reviewMode === "daily"){
      state.reviewIdx = (state.reviewIdx + 1) % pool.length;
    }else{
      if(pool.length === 1){
        state.reviewIdx = 0;
      }else{
        var idx;
        do{ idx = Math.floor(Math.random() * pool.length); }
        while(pool[idx].id === state.lastRandomId);
        state.reviewIdx = idx;
      }
    }
    renderReviewCard(false);
  }

  function renderReviewCard(resetIdx){
    var pool = computeReviewPool();
    state.reviewPool = pool;
    if(resetIdx) state.reviewIdx = 0;
    if(state.reviewIdx >= pool.length) state.reviewIdx = 0;

    var progressEl = document.getElementById("review-progress");
    var slot = document.getElementById("review-card-slot");

    if(pool.length === 0){
      progressEl.textContent = "";
      var hasAny = state.phrases.length > 0;
      slot.innerHTML = '<div class="card"><p class="card-eyebrow">표현 없음</p>' +
        '<p class="card-phrase" style="font-size:1.05rem;font-family:inherit;font-weight:400;">' +
        (hasAny ? esc("모두 '외운 표현'으로 표시되어 있어요. 위 체크박스를 켜면 다시 볼 수 있어요.") : esc("아직 저장한 표현이 없어요. '추가' 탭에서 첫 표현을 넣어보세요.")) +
        '</p></div>';
      return;
    }

    var card = pool[state.reviewIdx];
    state.lastRandomId = card.id;
    var eyebrow = state.reviewMode === "daily"
      ? "오늘의 카드 · " + (state.reviewIdx+1) + "/" + pool.length
      : "전체 랜덤";
    progressEl.textContent = eyebrow;

    var hasExamples = card.examples && card.examples.length > 0;
    var examplesHtml = hasExamples
      ? '<ul class="card-examples">' + card.examples.map(function(ex, i){
          var tag = ex.tag || "예문";
          var text = ex.text || "";
          return '<li>' +
            '<div class="ex-row"><span><span class="ex-tag">' + esc(tag) + '</span>' + esc(text) + '</span>' +
            (speechSupported ? '<button class="icon-btn-sm" data-speak-ex="' + i + '" aria-label="예문 발음 듣기">🔊</button>' : '') +
            '</div>' +
            (ex.ko ? '<p class="ex-translation" data-translation hidden>' + esc(ex.ko) + '</p>' : '') +
            '</li>';
        }).join("") + '</ul>'
      : '<p class="card-empty-ex">아직 예문이 없어요. 대화에서 "이 표현 예문 만들어줘"라고 요청해보세요.</p>';

    var hasAnyTranslation = hasExamples && card.examples.some(function(ex){ return !!ex.ko; });

    slot.innerHTML =
      '<div class="card">' +
        '<p class="card-eyebrow">' + esc(eyebrow) + '</p>' +
        '<div class="card-face">' +
          '<h2 class="card-phrase">' + esc(card.text) + '</h2>' +
          (speechSupported ? '<button class="icon-btn" id="speak-phrase-btn" type="button" aria-label="발음 듣기">🔊</button>' : '') +
        '</div>' +
        '<button class="reveal-btn" id="reveal-btn" type="button">뜻 · 예문 보기</button>' +
        '<div class="card-back" id="card-back" hidden>' +
          (card.meaning ? '<p class="card-meaning">' + esc(card.meaning) + '</p>' : '') +
          (hasAnyTranslation ? '<button class="translate-toggle-btn" id="translate-toggle-btn" type="button">번역 보기</button>' : '') +
          examplesHtml +
        '</div>' +
        '<div class="card-footer">' +
          '<label class="star-toggle"><input type="checkbox" id="review-mastered-toggle" ' + (card.mastered ? "checked" : "") + (writable ? "" : " disabled") + '><span>외웠어요</span></label>' +
        '</div>' +
      '</div>';

    var revealBtn = document.getElementById("reveal-btn");
    var cardBack = document.getElementById("card-back");
    revealBtn.addEventListener("click", function(){
      var isHidden = cardBack.hidden;
      cardBack.hidden = !isHidden;
      revealBtn.textContent = isHidden ? "접기" : "뜻 · 예문 보기";
    });
    var speakBtn = document.getElementById("speak-phrase-btn");
    if(speakBtn) speakBtn.addEventListener("click", function(){ speak(card.text); });
    slot.querySelectorAll("[data-speak-ex]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var i = parseInt(btn.dataset.speakEx, 10);
        speak(card.examples[i].text);
      });
    });
    var translateBtn = document.getElementById("translate-toggle-btn");
    if(translateBtn){
      translateBtn.addEventListener("click", function(){
        var shown = translateBtn.dataset.shown === "1";
        slot.querySelectorAll("[data-translation]").forEach(function(p){ p.hidden = shown; });
        translateBtn.dataset.shown = shown ? "0" : "1";
        translateBtn.textContent = shown ? "번역 보기" : "번역 숨기기";
      });
    }
    var masteredCb = document.getElementById("review-mastered-toggle");
    masteredCb.addEventListener("change", function(e){
      var val = e.target.checked;
      // defer: this handler's own container gets rebuilt by toggleMastered,
      // so let the native change event finish dispatching first
      setTimeout(function(){ toggleMastered(card.id, val); }, 0);
    });
  }

  function toggleMastered(id, val){
    var p = state.phrases.find(function(x){ return x.id === id; });
    if(!p) return;
    p.mastered = val;
    persist({ view: currentView(), reviewMode: state.reviewMode, reviewIdx: state.reviewIdx }, function(){
      updateStats();
      renderSyncNote();
      if(appRoot.querySelector("#view-list").dataset.active === "true") renderList();
      if(appRoot.querySelector("#view-review").dataset.active === "true") renderReviewCard(false);
    });
  }

  function currentView(){

    return el ? el.id.replace("view-", "") : "review";

  // ---------- list ----------
  document.getElementById("search-input").addEventListener("input", function(e){
    state.searchQuery = e.target.value.trim().toLowerCase();

  document.getElementById("include-mastered-list").addEventListener("change", function(e){

  function renderList(){
    var listEl = document.getElementById("phrase-list");
    var emptyEl = document.getElementById("list-empty");
    var pool = activePhrases(state.listIncludeMastered);
    if(state.searchQuery){
      pool = pool.filter(function(p){
        var hay = (p.text + " " + (p.meaning||"")).toLowerCase();
        return hay.indexOf(state.searchQuery) !== -1;
      });
    }
    if(pool.length === 0){
      listEl.innerHTML = "";
      emptyEl.hidden = false;
      emptyEl.textContent = state.phrases.length === 0
        ? "아직 저장한 표현이 없어요. '추가' 탭에서 첫 표현을 넣어보세요."
        : "조건에 맞는 표현이 없어요.";

    emptyEl.hidden = true;
    listEl.innerHTML = pool.map(function(p){
      return '<li class="phrase-row" data-id="' + p.id + '">' +
        '<input type="checkbox" class="row-mastered-toggle" data-toggle-id="' + p.id + '" ' + (p.mastered?"checked":"") + (writable ? "" : " disabled") + ' aria-label="외웠어요">' +
        '<div class="phrase-row-main">' +
          '<p class="phrase-row-text">' + esc(p.text) + '</p>' +
          (p.meaning ? '<p class="phrase-row-meaning">' + esc(p.meaning) + '</p>' : '') +
        '</div>' +
        (p.mastered ? '<span class="star-badge" title="외운 표현">★</span>' : '') +
      '</li>';
    }).join("");

    listEl.querySelectorAll(".phrase-row").forEach(function(row){
      row.addEventListener("click", function(e){
        if(e.target.classList.contains("row-mastered-toggle")) return;
        openEdit(row.dataset.id);
      });
    });
    listEl.querySelectorAll(".row-mastered-toggle").forEach(function(cb){
      cb.addEventListener("click", function(e){ e.stopPropagation(); });
      cb.addEventListener("change", function(e){
        var id = cb.dataset.toggleId;
        var val = e.target.checked;
        setTimeout(function(){ toggleMastered(id, val); }, 0);
      });
    });
  }

  // ---------- add / edit form ----------
  var form = document.getElementById("phrase-form");
  var editIdField = document.getElementById("edit-id");
  var textField = document.getElementById("field-text");
  var meaningField = document.getElementById("field-meaning");
  var ex1Field = document.getElementById("field-ex1");
  var ex2Field = document.getElementById("field-ex2");
  var ex3Field = document.getElementById("field-ex3");
  var deleteBtn = document.getElementById("delete-btn");
  var cancelEditBtn = document.getElementById("cancel-edit-btn");
  var deleteConfirm = document.getElementById("delete-confirm");
  var submitBtn = document.getElementById("submit-btn");

  function resetForm(){
    editIdField.value = "";
    textField.value = "";
    meaningField.value = "";
    ex1Field.value = "";
    ex2Field.value = "";
    ex3Field.value = "";
    deleteBtn.hidden = true;
    cancelEditBtn.hidden = true;
    deleteConfirm.hidden = true;
    submitBtn.textContent = "저장";
  }

  function openEdit(id){
    var p = state.phrases.find(function(x){ return x.id === id; });
    if(!p) return;
    editIdField.value = p.id;
    textField.value = p.text;
    meaningField.value = p.meaning || "";
    var examples = p.examples || [];
    var casual = examples.filter(function(ex){ return ex.tag !== "업무"; });
    var biz = examples.filter(function(ex){ return ex.tag === "업무"; });
    ex1Field.value = (casual[0] && casual[0].text) || "";
    ex2Field.value = (casual[1] && casual[1].text) || "";
    ex3Field.value = (biz[0] && biz[0].text) || "";
    deleteBtn.hidden = false;
    cancelEditBtn.hidden = false;
    deleteConfirm.hidden = true;
    submitBtn.textContent = "수정 저장";
    switchView("add");
  }

  cancelEditBtn.addEventListener("click", function(){ resetForm(); switchView("list"); });

  deleteBtn.addEventListener("click", function(){ deleteConfirm.hidden = false; });
  document.getElementById("cancel-delete-btn").addEventListener("click", function(){ deleteConfirm.hidden = true; });
  document.getElementById("confirm-delete-btn").addEventListener("click", function(){
    var id = editIdField.value;
    var next = state.phrases.filter(function(p){ return p.id !== id; });
    persist({ view: "list" }, function(){
      resetForm();
      showToast("삭제했어요.");
      switchView("list");
    }, next);
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var text = textField.value.trim();
    if(!text){ textField.focus(); return; }
    var examples = [];
    if(ex1Field.value.trim()) examples.push({text: ex1Field.value.trim(), tag: "일상"});
    if(ex2Field.value.trim()) examples.push({text: ex2Field.value.trim(), tag: "일상"});
    if(ex3Field.value.trim()) examples.push({text: ex3Field.value.trim(), tag: "업무"});
    var id = editIdField.value;
    var next = state.phrases.slice();
    var msg;
    if(id){
      next = next.map(function(p){
        if(p.id !== id) return p;
        return Object.assign({}, p, { text: text, meaning: meaningField.value.trim(), examples: examples });
      });
      msg = "수정했어요.";
    }else{
      next.unshift({
        id: uid(),
        text: text,
        meaning: meaningField.value.trim(),
        examples: examples,
        mastered: false,
        added: todayStr()
      });
      msg = "저장했어요.";
    }
    persist({ view: "list" }, function(){
      resetForm();
      showToast(msg);
      switchView("list");
    }, next);
  });

  // ---------- export / import ----------
  function exportViaBlobLink(jsonStr, filename){
    try{
      var blob = new Blob([jsonStr], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }catch(e){
      showToast("내보내기에 실패했어요.");
    }
  }

  document.getElementById("export-btn").addEventListener("click", function(){
    var filename = "sentence-drawer-backup-" + todayStr() + ".json";
    var jsonStr = JSON.stringify(state.phrases, null, 2);
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(function(dl){
        if(!dl){ exportViaBlobLink(jsonStr, filename); return; }
        dl.save({filename: filename, data: jsonStr}).then(function(){
          showToast("백업 파일을 저장했어요.");
        }).catch(function(err){
          if(err && err.code === "declined") return;
          if(err && err.code === "rate_limited"){ showToast("잠시 후 다시 시도해주세요."); return; }
          exportViaBlobLink(jsonStr, filename);
        });
      }).catch(function(){ exportViaBlobLink(jsonStr, filename); });
    }else{
      exportViaBlobLink(jsonStr, filename);
    }
  });
  document.getElementById("import-btn").addEventListener("click", function(){
    document.getElementById("import-file").click();
  });
  document.getElementById("import-file").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error("bad shape");
        var next = state.phrases.slice();
        var existingIds = {};
        next.forEach(function(p){ existingIds[p.id] = true; });
        var added = 0;
        data.forEach(function(p){
          if(!p || typeof p.text !== "string" || !p.text.trim()) return;
          if(p.id && existingIds[p.id]) return;
          var newId = p.id && !existingIds[p.id] ? p.id : uid();
          existingIds[newId] = true;
          var normExamples = Array.isArray(p.examples) ? p.examples.map(function(x){
            if(typeof x === "string") return {text: x, tag: "일상"};
            if(x && typeof x.text === "string"){
              var out = {text: x.text, tag: (x.tag === "업무" ? "업무" : "일상")};
              if(typeof x.ko === "string" && x.ko) out.ko = x.ko;
              return out;
            }
            return null;
          }).filter(Boolean) : [];
          next.push({
            id: newId,
            text: p.text,
            meaning: typeof p.meaning === "string" ? p.meaning : "",
            examples: normExamples,
            mastered: !!p.mastered,
            added: typeof p.added === "string" ? p.added : todayStr()
          });
          added++;
        });
        var addedCount = added;
        persist({ view: "list" }, function(){
          renderList();
          showToast(addedCount + "개 표현을 가져왔어요.");
        }, next);
      }catch(err){
        showToast("파일을 읽을 수 없어요. 이 앱에서 내보낸 백업 파일인지 확인해주세요.");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  // ---------- seed updates (new default phrases shipped after this device's first load) ----------
  var pendingSeedPhrases = [];
  function checkSeedUpdates(){
    var banner = document.getElementById("seed-banner");
    if(storageMode !== "local"){ banner.hidden = true; return; }
    var seed = readSeedData();
    var existingIds = {};
    state.phrases.forEach(function(p){ existingIds[p.id] = true; });
    pendingSeedPhrases = seed.filter(function(p){ return p.id && !existingIds[p.id]; });
    if(pendingSeedPhrases.length > 0){
      document.getElementById("seed-banner-text").textContent = "새로 추가된 기본 표현이 " + pendingSeedPhrases.length + "개 있어요.";
      banner.hidden = false;
    }else{
      banner.hidden = true;
    }
  }
  document.getElementById("seed-banner-btn").addEventListener("click", function(){
    var toAdd = pendingSeedPhrases.slice();
    if(!toAdd.length) return;
    var next = state.phrases.concat(toAdd);
    persist({ view: currentView() }, function(){
      document.getElementById("seed-banner").hidden = true;
      pendingSeedPhrases = [];
      updateStats();
      renderList();
      renderReviewCard(false);
      showToast(toAdd.length + "개 표현을 추가했어요.");
    }, next);
  });
  document.getElementById("seed-banner-dismiss").addEventListener("click", function(){
    document.getElementById("seed-banner").hidden = true;
  });

  // ---------- backfill translations into already-stored phrases ----------
  // The seed-merge banner above only ADDS phrases whose id the device hasn't
  // seen yet — it deliberately never touches phrases already stored locally,
  // so a user wouldn't lose edits to a phrase they'd already saved. But that
  // also means when we later add new data (like Korean translations) to
  // existing seed phrases, a device that already has those ids stored keeps
  // its old copy forever and never picks up the new "ko" fields. This does a
  // narrow, additive-only patch: for phrases that still match the shipped
  // seed by id, and examples that still match by tag+text (i.e. the user
  // never edited that specific example), fill in a missing "ko" field. It
  // never overwrites text the user changed and never touches mastered state.
  function backfillSeedTranslations(){
    if(storageMode !== "local") return false;
    var seed = readSeedData();
    var seedById = {};
    seed.forEach(function(p){ if(p.id) seedById[p.id] = p; });
    var changed = false;
    state.phrases.forEach(function(p){
      var sp = seedById[p.id];
      if(!sp || !Array.isArray(sp.examples) || !Array.isArray(p.examples)) return;
      p.examples.forEach(function(ex){
        if(ex.ko) return;
        var match = sp.examples.filter(function(se){
          return se.tag === ex.tag && se.text === ex.text && se.ko;
        })[0];
        if(match){
          ex.ko = match.ko;
          changed = true;
        }
      });
    });
    return changed;
  }

  // ---------- stats ----------
  function updateStats(){
    document.getElementById("stat-total").textContent = state.phrases.length;
    document.getElementById("stat-mastered").textContent = state.phrases.filter(function(p){return p.mastered;}).length;
  }

  // ---------- persistence ----------
  function buildFullHtml(phrases){
    var styleTag = document.getElementById("app-style").outerHTML;
    var shellTag = '<template id="app-shell">' + document.getElementById("app-shell").innerHTML + '</template>';
    var safeJson = JSON.stringify(phrases).replace(/</g, "\\u003c");
    var dataTag = '<script type="application/json" id="phrase-data">' + safeJson + '<' + '/script>';
    var scriptTag = document.getElementById("app-script").outerHTML;
    return '<!doctype html>\n<html lang="ko">\n<head>\n' + HEAD_STATIC + '\n' + styleTag + '\n</head>\n<body>\n' +
      '<div class="page" id="app"></div>\n' + shellTag + '\n' + dataTag + '\n' + scriptTag +
      '\n<div id="toast" class="toast" hidden></div>\n</body>\n</html>';
  }

  function errorMessage(err){
    if(!err || !err.code) return "저장 중 문제가 생겼어요. 다시 시도해주세요.";
    switch(err.code){
      case "not_writer":
      case "not_granted":
      case "consent_required":
        writable = false;
        renderSyncNote();
        return "읽기 전용으로 열려 있어서 저장할 수 없어요.";
      case "rate_limited":
        return "저장이 너무 잦아요. 잠시 후 다시 시도해주세요.";
      case "too_large":
        return "표현이 너무 많아서 저장 용량을 넘었어요.";
      case "not_declared":
      case "capability_disabled":
      case "capability_removed":
        storageMode = "local";
        renderSyncNote();
        return "이 화면에서는 자동 저장을 쓸 수 없어서, 이 브라우저에만 저장했어요.";
      default:
        return "저장 중 일시적인 문제가 있었어요. 다시 시도해주세요.";
    }
  }

  // persist(restoreCtx, onDone, nextPhrasesOptional)
  function persist(restoreCtx, onDone, nextPhrasesOptional){
    var next = nextPhrasesOptional || state.phrases;
    if(storageMode === "artifact" && artifactAPI && writable){
      try{
        sessionStorage.setItem("sentenceDrawer.restore", JSON.stringify(restoreCtx || {}));
      }catch(e){}
      artifactAPI.publish(buildFullHtml(next)).then(function(){
        // view reloads automatically on success
      }).catch(function(err){
        if(err && err.code === "conflict"){ return; } // reload already in flight
        state.phrases = next;
        showToast(errorMessage(err));
        if(onDone) onDone();
      });
    }else{
      state.phrases = next;
      try{
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(next));
      }catch(e){
        showToast("저장 공간을 사용할 수 없어요. 변경 내용이 이 화면을 벗어나면 사라질 수 있어요.");
      }
      if(onDone) onDone();
    }
  }

  // ---------- restore view across a publish-triggered reload ----------
  function restoreAfterReload(){
    try{
      var raw = sessionStorage.getItem("sentenceDrawer.restore");
      if(!raw) return;
      sessionStorage.removeItem("sentenceDrawer.restore");
      var ctx = JSON.parse(raw);
      if(ctx.reviewMode){
        state.reviewMode = ctx.reviewMode;
        segBtns.forEach(function(b){ b.setAttribute("aria-selected", b.dataset.mode === ctx.reviewMode ? "true" : "false"); });
      }
      if(typeof ctx.reviewIdx === "number") state.reviewIdx = ctx.reviewIdx;
      if(ctx.view) activateView(ctx.view);
    }catch(e){}
  }

  // ---------- init ----------
  function boot(){
    state.phrases = storageMode === "artifact" ? readSeedData() : loadLocalPhrases();
    if(backfillSeedTranslations()){
      try{ localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state.phrases)); }catch(e){}
    }
    updateStats();
    renderSyncNote();
    checkSeedUpdates();
    restoreAfterReload();
    renderReviewCard(false);
    renderList();
    registerServiceWorker();
  }

  function registerServiceWorker(){
    // Only meaningful for the plain static (GitHub Pages / local-file) deployment,
    // where sw.js/manifest.json/icons are actually served alongside this page.
    if(storageMode !== "local") return;
    if(!("serviceWorker" in navigator)) return;
    if(location.protocol.indexOf("http") !== 0) return; // skip on file:// — SW requires http(s)
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* fine without it */ });
    });
  }

  function initCapability(){
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("artifact").then(function(ns){
        if(ns){
          artifactAPI = ns;
          storageMode = "artifact";
        }else{
          storageMode = "local";
        }
        boot();
      }).catch(function(){
        storageMode = "local";
        boot();
      });
    }else{
      storageMode = "local";
      boot();
    }
  }

  initCapability();
})();
</script>

<div id="toast" class="toast" hidden></div>
</body>
</html>
